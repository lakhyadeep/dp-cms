<footer id="footer" class="footer dark-background">

    <div class="container footer-top">
        <div class="row gy-4">
            <div class="col-lg-4 col-md-4 footer-about">
                <a href="index.html" class="logo d-flex align-items-center">
                    <span class="sitename">{{settings:site_name}}</span>
                </a>
                <div class="footer-contact pt-3">
                    <p>{{settings:address}}</p>
                    <p class="mt-3"><strong>Phone:</strong> <span>{{settings:contact_number}}</span></p>
                    <p><strong>Email:</strong> <span>{{settings:email_id}}</span></p>
                </div>
                <div class="social-links d-flex mt-4">
                    {{settings:social}}
                    <a href="{{social_link}}" class="twitter"><i class="bi bi-{{class_name}}"></i></a>
                    {{ /settings:social}}
                </div>
            </div>


            {{partial:useful-links}}

            {{partial:service-links}}

        </div>
    </div>

    <div class="container copyright text-center mt-4">
        <p>{{footer:copyright}}</p>
