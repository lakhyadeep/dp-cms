title: 'Team Section'
fields:
  -
    handle: team_tittle
    field:
      type: text
      display: 'Team Title'
  -
    handle: team_sub_title
    field:
      type: textarea
      display: 'Team Sub Tittle'
  -
    handle: team_image
    field:
      container: assets
      type: assets
      display: 'Member Image'
  -
    handle: team_name
    field:
      type: text
      display: 'Member Name'
  -
    handle: team_designation
    field:
      type: text
      display: 'Member Designation'
  -
    handle: social_media_links
    field:
      type: replicator
      display: 'Social Media Links'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            member_social_link:
              display: 'Member Social Link'
              fields:
                -
                  handle: social_media_class_name
                  field:
                    type: text
                    display: 'Social Media Class Name'
                -
                  handle: social_media_link
                  field:
                    type: link
                    display: 'Social Media Link'
