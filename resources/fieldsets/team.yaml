title: 'Team Section'
fields:
  -
    handle: member_image
    field:
      container: assets
      type: assets
      display: 'Member Image'
  -
    handle: member_name
    field:
      type: text
      display: 'Member Name'
  -
    handle: member_designation
    field:
      type: text
      display: 'Member Designation'
  -
    handle: member_social_media_links
    field:
      type: replicator
      display: 'Social Media Links'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            member_social_link:
              display: 'Member Social Link'
              fields:
                -
                  handle: member_social_media_class_name
                  field:
                    type: text
                    display: 'Class Name'
                -
                  handle: member_social_media_link
                  field:
                    type: link
                    display: 'Social Media Link'
